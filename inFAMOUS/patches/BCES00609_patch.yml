Version: 1.2

PPU-d0c3e2a107c47d20d3316325ce6f75464a8f4f1d:
  "Mouse camera: no pitch auto-return":
    Games:
      "inFAMOUS":
        BCES00609: [ 01.00 ]
        BCES00220: [ 01.00 ]
        BCES00591: [ 01.00 ]
    Author: "kami-toolkit"
    Notes: "For mouse play through KAMI. The camera no longer pulls its pitch back to the horizon, standing or running, so KAMI's hold stops shaking the picture. The stick camera does not level itself either."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x007865f8, 0x00000000 ]   # follow settings +0x18, pitch return while standing (was 0x01000000)
      - [ bef32, 0x00565564, 0.0 ]         # pitch return while running, constant term (was -0.1)
      - [ bef32, 0x00565568, 0.0 ]         # pitch return while running, speed factor (was 0.0018333)

  "Mouse camera: no automatic turn while walking":
    Games:
      "inFAMOUS":
        BCES00609: [ 01.00 ]
        BCES00220: [ 01.00 ]
        BCES00591: [ 01.00 ]
    Author: "kami-toolkit"
    Notes: "For mouse play through KAMI. The camera no longer turns by itself towards the walking direction (diagonal and sideways running), so KAMI's hold stops shaking the picture. The stick camera does not follow the walking direction either."
    Patch Version: 1.0
    Patch:
      # camera update 0x00073AB8: the target of the follow-speed smoothing was lfs f2,0x7C(r9) (camera settings +0x7C, 0.7);
      # now it is lfs f2,-0x7F90(r30) - the constant 0.0 that the same function already uses on its other path
      - [ be32, 0x00073d0c, 0xc05e8070 ]   # was 0xc049007c

  "Mouse camera: no spring-back from obstacles when the mouse is idle":
    Games:
      "inFAMOUS":
        BCES00609: [ 01.00 ]
        BCES00220: [ 01.00 ]
        BCES00591: [ 01.00 ]
    Author: "kami-toolkit"
    Notes: "Recommended together with the other two entries. KAMI's profile keeps the camera collision counter (+0x29C) and the camera state (+0x1A8) at 0 only while the mouse is moving; when the mouse is idle the game can count the camera as blocked, take it over and turn it back by 30-45 degrees. This entry keeps the blocked counter at 0 all the time. May be combined with the profile as it is."
    Patch Version: 1.0
    Patch:
      # FUN_00072d70, blocked branch: addi r9,r9,1 (counter +0x29C += 1)  ->  li r9,0
      - [ be32, 0x00072e10, 0x39200000 ]   # was 0x39290001
